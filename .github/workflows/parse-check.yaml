name: parse-check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install knitr
        run: Rscript -e 'install.packages("knitr")'
      - name: Check that every R script and notebook parses
        run: Rscript .github/check_parse.R .
